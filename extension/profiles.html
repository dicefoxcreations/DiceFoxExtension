<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DiceFox – Profiles</title><link rel="stylesheet" href="profiles.css"><link rel="stylesheet" href="theme.css"></head><body><main>
<h1 data-i18n="profilesTitle">Site profiles</h1><p class="muted" data-i18n="profilesIntro"></p>
<div class="actions"><button id="import" data-i18n="importProfile"></button><input id="file" type="file" accept="application/json,.json" hidden><button id="new" data-i18n="newProfile"></button><button id="export" data-i18n="exportProfile"></button><button id="delete" class="danger" data-i18n="deleteProfile"></button></div>
<div id="status" class="status"></div>
<section id="detectPanel" class="panel detect-panel" hidden>
  <p><a href="guide.html">Guided detection</a></p><div class="detect-head"><div><h2 data-i18n="detectedPageTitle">Detected page</h2><div id="detectPage" class="muted"></div></div><div class="actions"><button id="exportDetectionDebug" data-i18n="exportDetectionDebug">Export debug report</button><button id="dismissDetect" data-i18n="dismiss">Dismiss</button></div></div>
  <p data-i18n="detectIntro"></p><p class="muted" data-i18n="debugReportPrivacy"></p>
  <div id="candidateList" class="candidate-list"></div>
  <details id="filterDetails"><summary data-i18n="detectedFilters">Detected filters / controls</summary><p class="muted" data-i18n="detectedFiltersHelp"></p><div id="detectedFilters" class="filter-list"></div></details>
  <details id="exactFacetDetails" hidden><summary data-i18n="exactFacets">Rebuild these filters exactly</summary><p class="muted" data-i18n="exactFacetsHelp"></p><div id="exactFacets" class="filter-list"></div></details>
  <div class="detect-config"><label class="field"><span data-i18n="detectedSourceName">Source name</span><input id="detectedSourceName"></label><label class="field"><span data-i18n="detectedSourceType">Use as</span><select id="detectedSourceType"><option value="collection">Collection</option><option value="catalog">Catalog</option><option value="glossary">Glossary</option><option value="section">Section</option></select></label></div>
  <div id="paginationScanArea" class="pagination-scan" hidden><div class="pagination-scan-main"><strong id="paginationScanSummary"></strong><div id="paginationEstimate" class="muted"></div><div id="paginationScanStatus" class="muted"></div><div class="muted" data-i18n="scanRunsInCrawlWindow"></div><details id="paginationScanDebugDetails"><summary data-i18n="scanDebugLiveTitle">Live scan debug</summary><pre id="paginationScanDebugLive" class="scan-debug-live"></pre></details></div><div class="pagination-scan-actions"><button id="scanAllPages" type="button" data-i18n="scanAllPages">Scan all list pages</button><button id="exportScanDebug" type="button" data-i18n="exportScanDebug">Export scan debug</button><button id="cancelScan" type="button" data-i18n="cancelScan" disabled>Cancel scan</button></div></div>
  <div id="childArea" hidden><div class="child-head"><div><h3 data-i18n="detectedChildPages">Detected child pages</h3><p class="muted" data-i18n="detectedChildHelp"></p></div><div class="child-selection"><span id="childSelectionCount" class="muted"></span><button id="childSelectAll" type="button" data-i18n="selectAll">Select all</button><button id="childSelectNone" type="button" data-i18n="selectNone">Select none</button></div></div><div class="child-tools"><input id="childSearch" type="search" data-i18n="childSearchPlaceholder" placeholder="Search detected pages"><div class="child-visible-actions"><button id="childSelectVisible" type="button" data-i18n="selectVisible">Select shown</button><button id="childSelectNoneVisible" type="button" data-i18n="selectNoneVisible">Deselect shown</button></div></div><div id="childLinks" class="child-links"></div><div class="actions"><button id="addChildren" data-i18n="addSelectedChildren">Add selected child pages as auto-detected sources</button></div></div><div class="actions"><button id="addDetected" class="primary" data-i18n="addDetectedSource">Add detected source to profile</button><button id="createDetectedProfile" data-i18n="createProfileFromDetection">Create new profile from this site</button></div>
</section>
<div class="layout"><aside class="panel profiles"><div id="list"></div></aside><section class="panel">
<label class="field"><span data-i18n="profileName"></span><input id="name"></label>
<label class="field"><span data-i18n="siteOrigin"></span><input id="origin" placeholder="https://example.org"></label>
<label class="field"><span data-i18n="description"></span><input id="description"></label>
<h2 data-i18n="sources">Sources</h2><div id="sourceRows"></div><div class="actions"><button id="addSource" data-i18n="addSource"></button><button id="addCurrent" data-i18n="addCurrentPage"></button></div>
<div class="actions"><button id="save" class="primary" data-i18n="saveProfile"></button><button id="test" data-i18n="testProfile"></button></div>
<details><summary data-i18n="advancedJson">Advanced profile JSON</summary><label class="field"><textarea id="json" class="json" spellcheck="false"></textarea></label><div class="actions"><button id="applyJson">Apply JSON to form</button></div></details>
<pre id="testOutput" class="test" hidden></pre>
</section></div>
</main><script src="url_utils.js"></script><script src="providers/registry.js"></script><script src="providers/dndbeyond.js"></script><script src="profile_manager.js"></script><script src="i18n.js"></script><script src="profiles.js"></script></body></html>
