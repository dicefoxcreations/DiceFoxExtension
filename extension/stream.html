<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DiceFox · Export</title><link rel="icon" href="icons/icon32.png"><link rel="stylesheet" href="popup.css"><link rel="stylesheet" href="send.css"></head>
<body class="send embedded"><main>
 <section class="card"><h2>AnotherWorldbuilder</h2><p id="connection" class="muted" aria-live="polite"></p><label class="field"><span>Which world?</span><select id="world"><option value="">Choose a world…</option></select></label></section>
 <section class="card" id="templates"><h2>Template check</h2><p id="templateSummary" class="muted">Choose a world.</p><details id="typeDetails" style="visibility:hidden"><summary>Show check results</summary><ul id="typeRows"></ul></details></section>
 <section class="card"><h2 id="state" aria-live="polite">Preparing selection…</h2><p id="selection" class="muted"></p><ul id="lists" class="lists" hidden></ul><label class="check"><input type="checkbox" id="refresh"> Update existing entries</label><label class="check"><input type="checkbox" id="fresh"> Fetch pages anew</label><div class="bar"><div id="bar"></div></div><p id="progress" aria-live="polite"></p><p id="totals" class="muted"></p><p id="error" role="alert"></p><details id="gone" hidden><summary id="goneTitle"></summary><ul id="goneList"></ul><button id="copyGone" type="button">Copy</button></details><div class="row"><button id="go" class="primary" disabled>Export now</button><button id="stop" hidden>Pause</button></div><p id="kept" class="muted" hidden><span id="keptCount"></span> <button id="forget" type="button" class="link">Forget</button></p><p id="shared" class="warn" hidden></p></section>
</main><script src="aw_bridge.js"></script><script src="aw/templates.js"></script><script src="stream.js"></script></body></html>
